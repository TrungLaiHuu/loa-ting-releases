<!doctype html>
<!--
  Ảnh chia sẻ (og:image) 1200 × 630 của landing page. Chụp lại bằng landing/og/render.sh
  -> assets/og-image.jpg và assets/apple-touch-icon.png.
-->
<html lang="vi">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  :root { --paper: #ECE9E4; --ink: #1C1E22; --navy: #1E2A44; --yellow: #F5C400; --muted: #5C6168; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--paper); font-family: "Be Vietnam Pro", sans-serif; color: var(--ink); position: relative; }
  .shot { position: absolute; right: -150px; top: -22px; height: 674px; }
  .text { position: absolute; left: 72px; top: 64px; width: 600px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px;
             letter-spacing: .08em; text-transform: uppercase; color: var(--navy); }
  .eyebrow i { width: 12px; height: 12px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 0 4px rgba(245,196,0,.25); }
  h1 { font-weight: 800; font-size: 104px; line-height: 1; letter-spacing: -.035em; color: var(--navy); margin-top: 22px; }
  h2 { font-weight: 700; font-size: 40px; line-height: 1.16; letter-spacing: -.02em; margin-top: 14px; }
  .hl { background: linear-gradient(transparent 62%, var(--yellow) 62%, var(--yellow) 92%, transparent 92%); padding: 0 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; width: 500px; }
  .chips span { font-weight: 600; font-size: 19px; padding: 9px 16px; border-radius: 999px; background: #fff;
                border: 1px solid rgba(28,30,34,.10); color: var(--ink); }
  .chips span.dark { background: var(--navy); color: #fff; border-color: var(--navy); }
  .site { position: absolute; left: 72px; bottom: 54px; display: flex; align-items: center; gap: 14px;
          font-weight: 700; font-size: 24px; color: var(--navy); }
  .site svg { width: 40px; height: 40px; }
</style>
</head>
<body>
  <img class="shot" src="../assets/loa-ting.jpg" alt="">
  <div class="text">
    <div class="eyebrow"><i></i>Loa thông minh để bàn · vỏ in 3D</div>
    <h1>Loa Ting</h1>
    <h2>Nhỏ gọn,<br>làm được <span class="hl">nhiều việc.</span></h2>
    <div class="chips">
      <span class="dark">Trợ lý AI tiếng Việt</span>
      <span>Nhạc · Đài VOV</span>
      <span>Khung ảnh</span>
      <span>Waze HUD</span>
      <span>Báo thức · Lịch âm</span>
      <span>Báo số dư</span>
    </div>
  </div>
  <div class="site">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1E2A44"/><rect x="4" y="4" width="24" height="24" rx="5.5" fill="#F5C400"/><rect x="8" y="7.5" width="16" height="9" rx="2" fill="#0E1116"/><g fill="#1E2A44"><circle cx="10.5" cy="20.5" r="1.1"/><circle cx="14.2" cy="20.5" r="1.1"/><circle cx="17.8" cy="20.5" r="1.1"/><circle cx="21.5" cy="20.5" r="1.1"/><circle cx="12.3" cy="24" r="1.1"/><circle cx="16" cy="24" r="1.1"/><circle cx="19.7" cy="24" r="1.1"/></g></svg>
    esp32.viennv.dev
  </div>
</body>
</html>
